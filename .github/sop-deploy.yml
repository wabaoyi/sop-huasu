name: SOP 刷新数据并部署

# 触发条件: 当 deploy-signal.json 发生变化时触发
on:
  push:
    paths:
      - 'deploy-signal.json'
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: 'manual trigger'

# 并发控制: 同一时间只跑一个部署
concurrency:
  group: sop-deploy
  cancel-in-progress: false

env:
  DEPLOY_SIGNAL: deploy-signal.json

jobs:
  refresh-and-deploy:
    name: 刷新数据并部署
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ====== 步骤 1: 检出代码 ======
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ====== 步骤 2: 打印触发信息 ======
      - name: 解析部署信号
        id: signal
        run: |
          echo "==== 部署信号 ===="
          cat ${{ env.DEPLOY_SIGNAL }}
          echo ""
          echo "==== 当前 version ===="
          VERSION=$(python3 -c "import json; print(json.load(open('${{ env.DEPLOY_SIGNAL }}'))['version'])")
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo ""
          echo "==== 最近的 commits ===="
          git log --oneline -5

      # ====== 步骤 3: 刷新数据 ======
      - name: 刷新数据
        id: refresh
        run: |
          echo "==== 开始刷新数据 ===="
          # 1. 如果有 refresh-data.sh 脚本，优先执行
          if [ -f .github/scripts/refresh-data.sh ]; then
            echo "执行用户自定义刷新脚本: .github/scripts/refresh-data.sh"
            bash .github/scripts/refresh-data.sh
          else
            echo "未找到自定义刷新脚本，使用默认占位逻辑"
            # 占位逻辑: 标记数据需要刷新（用户后续填充实际逻辑）
            python3 -c "
            import json
            try:
                with open('data.json', 'r', encoding='utf-8') as f:
                    data = json.load(f)
                print('当前 data.json version:', data.get('version', 'unknown'))
                print('请在 .github/scripts/refresh-data.sh 中实现实际刷新逻辑')
            except Exception as e:
                print('data.json 读取失败:', e)
            "
          fi

      # ====== 步骤 4: 构建 ======
      - name: 构建
        id: build
        run: |
          echo "==== 开始构建 ===="
          if [ -f .github/scripts/build.sh ]; then
            echo "执行用户自定义构建脚本: .github/scripts/build.sh"
            bash .github/scripts/build.sh
          else
            echo "无自定义构建脚本（如纯静态站点可忽略此步）"
          fi

      # ====== 步骤 5: 部署 ======
      - name: 部署
        id: deploy
        run: |
          echo "==== 开始部署 ===="
          if [ -f .github/scripts/deploy.sh ]; then
            echo "执行用户自定义部署脚本: .github/scripts/deploy.sh"
            bash .github/scripts/deploy.sh
          else
            echo "==== 默认部署: 直接提交刷新后的数据 ===="
            # 默认行为: 把任何被脚本改动的 data.json 提交回仓库
            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "auto-refresh: version ${{ steps.signal.outputs.version }}"
              git push
            else
              echo "无文件改动，跳过提交"
            fi
          fi

      # ====== 步骤 6: 写回部署结果 ======
      - name: 写回部署结果
        if: always()
        run: |
          echo "==== 写回部署结果到 deploy-signal.json ===="
          STATUS="${{ job.status }}"
          NOW=$(date -d "+8 hours" +"%Y-%m-%dT%H:%M:%S+08:00")
          python3 -c "
          import json
          with open('${{ env.DEPLOY_SIGNAL }}', 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['last_deploy_status'] = '$STATUS'
          data['last_deploy_at'] = '$NOW'
          with open('${{ env.DEPLOY_SIGNAL }}', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.DEPLOY_SIGNAL }}
          git commit -m "deploy: version ${{ steps.signal.outputs.version }} -> $STATUS" || echo "无需提交"
          git push || echo "无 push 权限"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ====== 步骤 7: 总结 ======
      - name: 部署完成
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  SOP 刷新部署完成"
          echo "============================================"
          echo "  触发 version:  ${{ steps.signal.outputs.version }}"
          echo "  最终状态:      ${{ job.status }}"
          echo "  时间:          $(date -d "+8 hours" +"%Y-%m-%d %H:%M:%S %Z")"
          echo "============================================"
